<div id="view-caregiver-calendar" class="view-section hidden h-full">
  <div
    class="grid grid-cols-1 md:grid-cols-[200px_1fr_auto] lg:grid-cols-[240px_1fr_auto_auto] md:grid-rows-[auto_auto_1fr_1fr] lg:grid-rows-[auto_1fr_1fr_1fr] h-full gap-4 overflow-y-auto md:overflow-hidden p-2 lg:p-4"
  >
    <!-- Sidebar: Monthly Calendar & List -->
    <div
      class="md:col-start-1 md:col-span-1 md:row-start-1 md:row-span-4 lg:col-start-1 lg:col-span-1 lg:row-start-1 lg:row-span-4 flex flex-col gap-4 h-auto md:h-full lg:h-full"
    >
      <!-- Caregiver/Client List Filter -->
      <div
        class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 flex-1 flex flex-col overflow-hidden min-h-[300px] lg:min-h-0"
      >
        <div class="flex flex-col gap-2 h-full min-h-0">
          <button
            type="button"
            onclick="togglePersonSection('caregiver')"
            class="w-full flex items-center justify-between px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 hover:bg-gray-100 transition"
          >
            <span class="font-bold text-gray-700">Caregivers</span>
            <i
              id="caregiverSectionIcon"
              class="ph ph-caret-down text-gray-500"
            ></i>
          </button>
          <div
            id="caregiverSectionBody"
            class="hidden border border-gray-100 rounded-lg p-2 overflow-y-auto space-y-1 min-h-[110px] max-h-[160px]"
          >
            <div class="text-xs text-gray-400 text-center mt-2">Loading...</div>
          </div>

          <button
            type="button"
            onclick="togglePersonSection('client')"
            class="w-full flex items-center justify-between px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 hover:bg-gray-100 transition"
          >
            <span class="font-bold text-gray-700">Clients</span>
            <i
              id="clientSectionIcon"
              class="ph ph-caret-right text-gray-500"
            ></i>
          </button>
          <div
            id="clientSectionBody"
            class="hidden border border-gray-100 rounded-lg p-2 overflow-y-auto space-y-1 min-h-[110px] max-h-[160px]"
          >
            <div class="text-xs text-gray-400 text-center mt-2">Loading...</div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
        <div class="flex items-center justify-between mb-4">
          <span id="miniMonthLabel" class="font-bold text-gray-800">--</span>
          <div class="flex gap-1">
            <button
              onclick="changeMiniMonth(-1)"
              class="p-1 hover:bg-gray-100 rounded"
            >
              <i class="ph ph-caret-left"></i>
            </button>
            <button
              onclick="changeMiniMonth(1)"
              class="p-1 hover:bg-gray-100 rounded"
            >
              <i class="ph ph-caret-right"></i>
            </button>
          </div>
        </div>
        <div
          class="grid grid-cols-7 gap-1 text-center text-xs mb-2 text-gray-400 font-bold"
        >
          <div>S</div>
          <div>M</div>
          <div>T</div>
          <div>W</div>
          <div>T</div>
          <div>F</div>
          <div>S</div>
        </div>
        <div
          id="miniMonthGrid"
          class="grid grid-cols-7 gap-1 text-center text-sm"
        >
          <!-- Mini cells -->
        </div>
      </div>
    </div>

    <!-- Toggles and Perspective -->
    <div
      class="md:col-start-2 md:col-span-2 md:row-start-1 lg:col-start-2 lg:col-span-1 lg:row-start-1 flex flex-col items-start gap-2 min-w-0"
    >
      <div
        id="calendarViewToggle"
        class="flex items-center gap-1 bg-white p-1 rounded-lg shadow-sm border border-gray-200"
      >
        <button
          data-view="day"
          onclick="setCalendarView('day')"
          class="calendar-view-btn px-3 py-1 rounded-md text-sm font-semibold text-gray-600 hover:bg-gray-100"
        >
          Day
        </button>
        <button
          data-view="week"
          onclick="setCalendarView('week')"
          class="calendar-view-btn px-3 py-1 rounded-md text-sm font-semibold text-gray-600 hover:bg-gray-100"
        >
          Week
        </button>
        <button
          data-view="biweekly"
          onclick="setCalendarView('biweekly')"
          class="calendar-view-btn px-3 py-1 rounded-md text-sm font-semibold text-gray-600 hover:bg-gray-100"
        >
          Biweekly
        </button>
        <button
          data-view="month"
          onclick="setCalendarView('month')"
          class="calendar-view-btn px-3 py-1 rounded-md text-sm font-semibold text-gray-600 hover:bg-gray-100"
        >
          Month
        </button>
      </div>
    </div>

    <!-- Period Section -->
    <div
      class="md:col-start-2 md:col-span-1 md:row-start-2 lg:col-start-3 lg:col-span-1 lg:row-start-1 flex items-center justify-center md:justify-start lg:justify-center"
    >
      <div
        class="flex items-center gap-2 bg-white p-1.5 rounded-lg shadow-sm border border-gray-200 w-full sm:w-auto justify-center"
      >
        <button
          onclick="changePeriod(-1)"
          class="p-2 hover:bg-gray-100 rounded-full text-gray-600 transition-colors"
        >
          <i class="ph ph-caret-left text-xl"></i>
        </button>
        <span
          id="currentWeekLabel"
          class="font-bold text-gray-700 w-40 text-center whitespace-nowrap"
          >--</span
        >
        <button
          onclick="changePeriod(1)"
          class="p-2 hover:bg-gray-100 rounded-full text-gray-600 transition-colors"
        >
          <i class="ph ph-caret-right text-xl"></i>
        </button>
      </div>
    </div>

    <!-- Buttons -->
    <div
      class="md:col-start-3 md:col-span-1 md:row-start-2 lg:col-start-4 lg:col-span-1 lg:row-start-1 flex items-center justify-end gap-2 md:gap-1 flex-wrap md:flex-nowrap"
    >
      <button
        onclick="appNavigate('shifts')"
        title="Add Shift"
        aria-label="Add Shift"
        class="bg-[#65c027] text-white p-2 md:p-1.5 lg:p-2.5 rounded-lg font-bold shadow-lg hover:bg-[#54a020] transition transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center"
      >
        <i class="ph ph-plus font-bold text-lg md:text-base lg:text-xl"></i>
      </button>
      <button
        onclick="downloadPDF()"
        title="Export PDF"
        aria-label="Export PDF"
        class="bg-gradient-to-r from-red-500 to-orange-600 text-white p-2 md:p-1.5 lg:p-2.5 rounded-lg font-bold shadow-lg hover:from-red-600 hover:to-orange-700 transition transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center"
      >
        <i class="ph ph-file-pdf text-lg md:text-base lg:text-xl"></i>
      </button>
      <button
        type="button"
        title="Full Screen"
        aria-label="Full Screen"
        class="bg-white text-gray-700 p-2 md:p-1.5 lg:p-2.5 rounded-lg font-bold shadow-lg border border-gray-200 hover:bg-gray-50 transition transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center"
      >
        <i class="ph ph-corners-out text-lg md:text-base lg:text-xl"></i>
      </button>
    </div>

    <!-- Calendar View -->
    <div
      class="md:col-start-2 md:col-span-2 md:row-start-3 md:row-span-2 lg:col-start-2 lg:col-span-3 lg:row-start-2 lg:row-span-3 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden"
    >
      <!-- Days Header -->
      <div
        class="grid grid-cols-7 border-b border-gray-200 bg-gray-50 flex-shrink-0"
      >
        <div
          class="p-3 text-center font-bold text-gray-500 text-sm border-r border-gray-100"
        >
          Sun
        </div>
        <div
          class="p-3 text-center font-bold text-gray-500 text-sm border-r border-gray-100"
        >
          Mon
        </div>
        <div
          class="p-3 text-center font-bold text-gray-500 text-sm border-r border-gray-100"
        >
          Tue
        </div>
        <div
          class="p-3 text-center font-bold text-gray-500 text-sm border-r border-gray-100"
        >
          Wed
        </div>
        <div
          class="p-3 text-center font-bold text-gray-500 text-sm border-r border-gray-100"
        >
          Thu
        </div>
        <div
          class="p-3 text-center font-bold text-gray-500 text-sm border-r border-gray-100"
        >
          Fri
        </div>
        <div class="p-3 text-center font-bold text-gray-500 text-sm">Sat</div>
      </div>
      <!-- Days Grid -->
      <div
        id="weekGrid"
        class="grid grid-cols-7 flex-1 overflow-y-auto bg-white"
      >
        <!-- Cells will be generated by JS -->
      </div>
    </div>
  </div>

  <!-- Shift Details Modal -->
  <div
    id="shiftDetailsModal"
    class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center"
  >
    <div
      class="bg-white rounded-xl shadow-lg w-full max-w-lg mx-4 overflow-hidden flex flex-col max-h-[90vh]"
    >
      <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-lg text-gray-800">Shift Details</h3>
        <button
          onclick="closeShiftDetailsModal()"
          class="text-gray-500 hover:text-gray-700"
        >
          <i class="ph ph-x text-xl"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto" id="shiftDetailsContent">
        <!-- populated by JS -->
      </div>
      <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
        <button
          onclick="closeShiftDetailsModal()"
          class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium"
        >
          Close
        </button>
      </div>
    </div>
  </div>
</div>
